<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Humble Shop</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: rgba(255, 240, 245, 0.4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #5a4a4a;
        }

        /* Main Card Container */
        .welcome-card {
            background: #fffcfc;
            border: 6px solid #f2e3e5;
            border-radius: 36px;
            padding: 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(242, 227, 229, 0.6);
            animation: float 4s ease-in-out infinite;
        }

        /* Picture Frame para sa iyong design image */
        .image-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(232, 197, 203, 0.3);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 1.5rem;
            color: #7a5c61;
            margin-bottom: 10px;
            font-style: italic;
            font-weight: normal;
        }

        p.description {
            font-size: 0.88rem;
            color: #776b6d;
            line-height: 1.5;
            margin-bottom: 20px;
            padding: 0 5px;
        }

        /* Peony Cutie Owner Button */
        .owner-button {
            display: inline-block;
            background: #e8c5cb;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(232, 197, 203, 0.5);
            letter-spacing: 0.5px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <!-- Dito natin ilalagay ang eksaktong image mo -->
        <div class="image-container">
            <img src="welcome.png" alt="Welcome Bunny">
        </div>

        <h1>Hey Cutiepie</h1>
        
        <p class="description">
            welcome to my humble shop. enjoy to choose anything but make sure to check out. mwahh
        </p>

        <div class="owner-button">
            peony cutie owner ♥
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
